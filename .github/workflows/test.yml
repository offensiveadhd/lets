name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    env:
      LETS_HOME: ${{ runner.temp }}/lets-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/unit.test.mjs
      - run: node tests/mcp-smoke.mjs
      - run: node tests/hook-drain.mjs
      - run: node engine/bin/lets.mjs validate

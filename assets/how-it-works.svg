<text class="k" x="405" y="112"><tspan class="m pl">LIP</tspan> envelopes</text><text class="k" x="405" y="170">POST up, SSE down</text><text class="k" x="405" y="196">loopback + token</text>
<text class="k" x="875" y="112"><tspan class="m pl">MCP</tspan></text><text class="k" x="875" y="170">stdio</text>

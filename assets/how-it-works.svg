<rect class="b" x="510" y="34" width="260" height="202" rx="16"><animate attributeName="stroke" dur="12s" repeatCount="indefinite" values="#5a44a0;#5a44a0;#6bf0ff;#6bf0ff;#5a44a0;#5a44a0;#ff6bd6;#ff6bd6;#5a44a0;#5a44a0;#5ef2a6;#5ef2a6;#5a44a0;#5a44a0" keyTimes="0;.1083;.1167;.14;.15;.4417;.45;.4733;.4833;.7667;.775;.9567;.9667;1"/></rect><text class="t" x="640" y="80">lets engine</text><text class="s" x="640" y="114">Node host on loopback,</text><text class="s" x="640" y="142">zero dependencies</text><path d="M530 164H750" stroke="#3a2a63" stroke-width="2"/><text class="k" x="640" y="208" opacity="1">sessions · Doto's memory<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.7667;.7833;.95;.9667;1"/></text><g opacity="0"><path d="M562 201l6 6l10 -12" fill="none" stroke="#5ef2a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="gr" x="590" y="208" font-size="20" font-weight="600">session saved</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.7667;.7833;.95;.9667;1"/></g>
<rect class="b" x="980" y="34" width="260" height="202" rx="16"><animate attributeName="stroke" dur="12s" repeatCount="indefinite" values="#5a44a0;#5a44a0;#6bf0ff;#6bf0ff;#5a44a0;#5a44a0;#5ef2a6;#5ef2a6;#5a44a0;#5a44a0" keyTimes="0;.2083;.2167;.29;.3;.85;.8583;.9567;.9667;1"/></rect><text class="t" x="1110" y="80">Claude</text><text class="s" x="1110" y="114">in Claude Code,</text><text class="s" x="1110" y="142">with the lets MCP tools</text><path d="M1000 164H1220" stroke="#3a2a63" stroke-width="2"/><g opacity="1"><rect x="1020" y="180" width="96" height="36" rx="10" fill="#1a1030" stroke="#3a2a63" stroke-width="2"/><text class="c m dm" x="1068" y="205">listen</text><g opacity="0"><rect x="1020" y="180" width="96" height="36" rx="10" fill="#293855" stroke="#6bf0ff" stroke-width="2.5"/><text class="c m" x="1068" y="205">listen</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.2083;.2208;.2958;.3083;1"/></g><rect x="1128" y="180" width="72" height="36" rx="10" fill="#1a1030" stroke="#3a2a63" stroke-width="2"/><text class="c m dm" x="1164" y="205">send</text><g opacity="0"><rect x="1128" y="180" width="72" height="36" rx="10" fill="#43204e" stroke="#ff6bd6" stroke-width="2.5"/><text class="c m" x="1164" y="205">send</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3417;.3542;.4458;.4583;1"/></g><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.85;.8667;.95;.9667;1"/></g><g opacity="0"><text class="c gr" x="1110" y="208" font-weight="600">answers in the chat</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.85;.8667;.95;.9667;1"/></g>
<g opacity="1" transform="translate(300 135)"><circle r="17" fill="#6bf0ff" fill-opacity=".2"/><circle r="8.5" fill="#6bf0ff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="300 135;300 135;510 135;510 135;300 135;300 135" keyTimes="0;.0417;.1083;.125;.1267;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1;1" keyTimes="0;.1125;.1208;.975;.9833;1"/></g><g opacity="0" transform="translate(770 135)"><circle r="17" fill="#6bf0ff" fill-opacity=".2"/><circle r="8.5" fill="#6bf0ff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="770 135;770 135;980 135;980 135;770 135;770 135" keyTimes="0;.1417;.2083;.225;.2267;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.1333;.1417;.2125;.2208;1"/></g><g opacity="0" transform="translate(980 135)"><circle r="17" fill="#ff6bd6" fill-opacity=".2"/><circle r="8.5" fill="#ff6bd6"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="980 135;980 135;770 135;770 135;980 135;980 135" keyTimes="0;.375;.4417;.4583;.46;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.3667;.375;.4458;.4542;1"/></g><g opacity="0" transform="translate(510 135)"><circle r="17" fill="#ff6bd6" fill-opacity=".2"/><circle r="8.5" fill="#ff6bd6"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="510 135;510 135;300 135;300 135;510 135;510 135" keyTimes="0;.475;.5417;.5583;.56;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.4667;.475;.5458;.5542;1"/></g><g opacity="0" transform="translate(300 135)"><circle r="17" fill="#6bf0ff" fill-opacity=".2"/><circle r="8.5" fill="#6bf0ff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="300 135;300 135;510 135;510 135;300 135;300 135" keyTimes="0;.7;.7667;.7833;.785;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6917;.7;.7708;.7792;1"/></g><g opacity="0" transform="translate(770 135)"><circle r="17" fill="#6bf0ff" fill-opacity=".2"/><circle r="8.5" fill="#6bf0ff"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="770 135;770 135;980 135;980 135;770 135;770 135" keyTimes="0;.7833;.85;.8667;.8683;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.775;.7833;.8542;.8625;1"/></g><g opacity="0" transform="translate(510 135)"><circle r="17" fill="#ff6bd6" fill-opacity=".2"/><circle r="8.5" fill="#ff6bd6"/><animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="510 135;510 135;300 135;300 135;510 135;510 135" keyTimes="0;.7833;.85;.8667;.8683;1"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.775;.7833;.8542;.8625;1"/></g>
<g opacity="1"><text class="m" x="40" y="306" font-size="26" font-weight="700">graph.node.create<tspan dx="18" class="cy" font-size="20" font-weight="600" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">an event, going up</tspan></text><text x="40" y="344" font-size="22">You draw a node. The event goes up through the engine and comes out of Claude's <tspan class="m cy">listen</tspan>.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;.3;.3167;.9833;1"/></g>
<g opacity="0"><text class="m" x="40" y="306" font-size="26" font-weight="700">graph.node.add<tspan dx="18" class="mg" font-size="20" font-weight="600" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">a command, coming down</tspan></text><text x="40" y="344" font-size="22">Claude answers with <tspan class="m mg">send</tspan>. The command comes down and the node appears on your board.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.325;.3417;.6333;.65;1"/></g>
<g opacity="0"><text class="m" x="40" y="306" font-size="26" font-weight="700">graph.export<tspan dx="18" class="gr" font-size="20" font-weight="600" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">the handoff</tspan></text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6583;.675;.9583;.975;1"/></g><g opacity="0"><text x="40" y="344" font-size="22">You press Send to Claude. The engine saves the board as a session and tells the window to close.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.6583;.675;.8125;.8292;1"/></g><g opacity="0"><text x="40" y="344" font-size="22">Claude answers in the Claude Code chat. Say continue, and the board comes back as you sent it.</text><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.8333;.85;.9583;.975;1"/></g>
<text class="dm" x="40" y="410" font-size="20">If Claude is away, events wait in the engine and arrive with your next prompt.</text>
</svg>

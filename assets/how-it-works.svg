.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.t{font-size:28px;font-weight:700;text-anchor:middle}
.s{font-size:20px;fill:#a99cd0;text-anchor:middle}
.k{font-size:20px;fill:#a99cd0;text-anchor:middle}
.c{font-size:20px;text-anchor:middle}
.b{fill:#1a1030;fill-opacity:.9;stroke:#5a44a0;stroke-width:2.5}
.dm{fill:#a99cd0}.pl{fill:#ece6ff}.cy{fill:#6bf0ff}.mg{fill:#ff6bd6}.gr{fill:#5ef2a6}
</style>

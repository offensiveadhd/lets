<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-labelledby="lh-t lh-d">
<title id="lh-t">How lets works</title>
<desc id="lh-d">Three boxes in a row. Your window (a unique plus the shell: Doto, chat, components) talks to the lets engine, a zero-dependency Node host on loopback, in LIP envelopes: POST up, Server-Sent Events down. The engine talks to Claude in Claude Code over MCP on stdio. The loop shows three moments. An event, graph.node.create, goes up from the window through the engine and comes out of the listen tool. A command, graph.node.add, comes down from the send tool into the window. Then the handoff: graph.export goes up, the engine saves the session and tells the window to close, and Claude answers in the Claude Code chat.</desc>

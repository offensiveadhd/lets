<g fill="none" stroke-width="1.6"><rect x="98" y="138.500" width="15" height="15" rx="4" stroke="#a66bff"/><rect x="124" y="138.500" width="15" height="15" rx="4" stroke="#6bf0ff"/><rect x="150" y="138.500" width="15" height="15" rx="7.5" stroke="#ff6bd6"/><rect x="176" y="138.500" width="15" height="15" rx="4" stroke="#5ef2a6"/></g>
<rect x="424" y="134.500" width="110" height="23" rx="8" fill="url(#lb-btn)"/>

<!-- the two lanes -->
<g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<path d="M190 124V54" stroke="#6bf0ff" stroke-opacity=".45" stroke-dasharray="2 6"/><path d="M183 61l7-8 7 8" stroke="#6bf0ff" stroke-opacity=".85"/>
<path d="M358 50V120" stroke="#ff6bd6" stroke-opacity=".45" stroke-dasharray="2 6"/><path d="M351 113l7 8 7-8" stroke="#ff6bd6" stroke-opacity=".85"/>
</g>
